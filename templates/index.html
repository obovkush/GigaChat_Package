<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GigaChat Web Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .message {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
        }
        .user-message {
            background-color: #e3f2fd;
            margin-right: 2%;
        }
        .ai-message {
            background-color: #f5f5f5;
            margin-left: 2%;
        }
        .message-content {
            white-space: wrap;
        }
        .message-time {
            font-size: 0.8em;
            color: #666;
            margin-top: 5px;
        }
        /* Стили для форматированного текста */
        .ai-message h1, .ai-message h2, .ai-message h3 {
            font-size: 1em;
            margin-top: 1em;
            margin-bottom: 0.5em;
        }
        .ai-message p {
            margin-bottom: 1em;
            line-height: 1.5;
        }
        .ai-message ul, .ai-message ol {
            margin-bottom: 1em;
            padding-left: 2em;
        }
        .ai-message li {
            margin-bottom: 0.5em;
        }
        .ai-message code {
            background-color: #f0f0f0;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: monospace;
        }
        .ai-message pre {
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .ai-message blockquote {
            border-left: 4px solid #ccc;
            margin: 1em 0;
            padding-left: 1em;
            color: #666;
        }
        /* Стили для сворачиваемого контента */
        .collapsible-content {
            max-height: 500px;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .collapsed {
            max-height: 500px;
        }
        .expanded {
            max-height: none;
        }
        .toggle-button {
            display: block;
            width: 100%;
            text-align: center;
            padding: 5px;
            background-color: #f0f0f0;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
            color: #666;
        }
        .toggle-button:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container chat-container">
        <h1 class="text-center mb-4">GigaChat Web Interface</h1>

        <div id="chat-messages">
            {% for entry in history %}
            <div class="message user-message">
                <div class="message-content">{{ entry.user_message }}</div>
                <div class="message-time">{{ entry.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</div>
            </div>
            <div class="message ai-message">
                <div class="message-content collapsible-content collapsed" id="message-{{ loop.index }}">
                    {{ entry.ai_response | safe }}
                </div>
                <button class="toggle-button" onclick="toggleMessage('message-{{ loop.index }}')">Развернуть</button>
                <div class="message-time">{{ entry.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</div>
            </div>
            {% endfor %}
        </div>

        <div class="input-group mt-4">
            <input type="text" id="message-input" class="form-control" placeholder="Введите ваше сообщение...">
            <button class="btn btn-primary" id="send-button">Отправить</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleMessage(messageId) {
            const content = document.getElementById(messageId);
            const button = content.nextElementSibling;

            if (content.classList.contains('collapsed')) {
                content.classList.remove('collapsed');
                content.classList.add('expanded');
                button.textContent = 'Свернуть';
            } else {
                content.classList.remove('expanded');
                content.classList.add('collapsed');
                button.textContent = 'Развернуть';
            }
        }

        document.getElementById('send-button').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage() {
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value.trim();

            if (message) {
                // Добавляем сообщение пользователя
                const chatMessages = document.getElementById('chat-messages');
                const timestamp = new Date().toLocaleString();
                const messageId = 'message-' + Date.now();

                chatMessages.innerHTML += `
                    <div class="message user-message">
                        <div class="message-content">${message}</div>
                        <div class="message-time">${timestamp}</div>
                    </div>
                `;

                // Отправляем запрос на сервер
                fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        chatMessages.innerHTML += `
                            <div class="message ai-message">
                                <div class="message-content">Ошибка: ${data.error}</div>
                                <div class="message-time">${timestamp}</div>
                            </div>
                        `;
                    } else {
                        chatMessages.innerHTML += `
                            <div class="message ai-message">
                                <div class="message-content collapsible-content collapsed" id="${messageId}">
                                    ${data.response}
                                </div>
                                <button class="toggle-button" onclick="toggleMessage('${messageId}')">Развернуть</button>
                                <div class="message-time">${timestamp}</div>
                            </div>
                        `;
                    }
                    // Прокручиваем чат вниз
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                })
                .catch(error => {
                    console.error('Error:', error);
                    chatMessages.innerHTML += `
                        <div class="message ai-message">
